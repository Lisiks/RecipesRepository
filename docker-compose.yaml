services:
  postgres:
    image: postgres:16
    container_name: postgres_container
    environment:
      POSTGRES_USER: lisiks
      POSTGRES_PASSWORD: lisiks
      POSTGRES_DB: recipes
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  phppgadmin:
    image: overconsulting/phppgadmin:latest
    container_name: phppgadmin_container
    ports:
      - "8080:8080"
    environment:
      PG_HOST: postgres             
      PG_DEFAULT_DB: recipes
      PG_USER: lisiks
      PG_PASSWORD: lisiks
      APP_PASSWORD: lisiks
    depends_on:
      - postgres
        
  
volumes:
  pgdata:
